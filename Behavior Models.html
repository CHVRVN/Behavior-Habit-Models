{name:"Implementation Intentions",cat:"Friction & Effort",year:1999,author:"Peter Gollwitzer",catKey:"Friction",
overview:"Specific if-then plans ('If situation X occurs, I will do Y') dramatically increase goal attainment by making the anticipated situation highly accessible, enabling automatic initiation of the planned behavior when the cue is encountered.",
history:"Gollwitzer published the defining paper in 1999. His meta-analysis with Sheeran (2006) across 94 studies found a medium-to-large effect (d = 0.65) — one of the stronger effects in behavior change research.",
methodType:"Laboratory and Field Experiments + Meta-Analysis (94 Studies)",
methodology:"Implementation intention experiments follow a standard paradigm: participants in an experimental group are asked to form a specific if-then plan in addition to stating their goal intention ('I intend to do X'). Control participants state only the goal intention or receive no-goal instructions. Outcomes are measured behaviorally (e.g., appointment attendance, pill taking, fruit consumption, exam preparation). Gollwitzer & Brandstätter (1997) demonstrated the design with university students: those who formed implementation intentions about when/where/how to send a report during Christmas vacation were significantly more likely to do so compared to those who only stated intention. The proposed mechanism — heightened cognitive accessibility of the anticipated situation — was tested by measuring response times to situation-related words after implementation intention formation.",
citation:"Gollwitzer, P. M. (1999). Implementation intentions: Strong effects of simple plans. American Psychologist, 54(7), 493–503. Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis. Advances in Experimental Social Psychology, 38, 69–119.",
pros:["Strong meta-analytic support (d = 0.65 across 94 studies)","Directly closes the intention-behavior gap that TPB identifies but doesn't solve","Simple, free, and teachable in minutes — exceptional benefit-to-effort ratio"],
cons:["Works best when strong goal intention already exists","Specificity requirement limits use for goals without clear situational cues","May produce rigid scripted responding that's not adaptive to changing circumstances"],
notes:"Oettingen's WOOP (Wish-Outcome-Obstacle-Plan) explicitly incorporates an implementation intention as the 'Plan' step — combining mental contrasting with if-then planning for amplified effectiveness."},

{name:"Temptation Bundling",cat:"Friction & Effort",year:2014,author:"Katherine Milkman, Julia Minson & Kevin Volpp",catKey:"Friction",
overview:"Pairing a temptation (instantly enjoyable) with a chore (valuable but effortful) increases motivation to perform the chore. The temptation is restricted to the bundled context only — you only listen to your favorite podcast while at the gym.",
history:"Milkman et al.'s 2014 Management Science paper demonstrated that gym attendance increased significantly when iPods with tempting audiobooks were available only at the gym. Built on the Premack Principle but operationalized for present-bias.",
methodType:"Field Experiment (University Gym, Random Assignment)",
methodology:"Milkman, Minson & Volpp (2014) conducted a field experiment at the university gym. In Study 1 (pilot): participants received iPods loaded with tempting audiobooks of their choice. Half were asked to keep the iPod only at the gym (bundled condition); the other half kept it with them at all times (control). Gym visit rates were tracked via ID swipes for 7 weeks. Study 2 (full RCT): 226 participants were randomly assigned to (a) instant access to tempting audiobooks at the gym only (bundled), (b) gave iPods outright (free access), or (c) control. Gym visits were significantly higher for the bundled condition. Effect was most pronounced for people who reported lower intrinsic motivation for exercise. The mechanism: temptation bundling reduces the relative cost of the effortful behavior by attaching immediate hedonic benefit.",
citation:"Milkman, K. L., Minson, J. A., & Volpp, K. G. M. (2014). Holding the Hunger Games hostage at the gym: An evaluation of temptation bundling. Management Science, 60(2), 283–299.",
pros:["Addresses present bias directly — makes effortful behavior immediately rewarding","Low-cost and self-administered","Growing body of behavioral economics research supporting the mechanism"],
cons:["Requires actually restricting the temptation to the bundled context — discipline required up front","Effectiveness fades over time as pairing becomes routine","Only works if the temptation is genuinely compelling enough to motivate"],
notes:"Present bias — overweighting immediate costs relative to delayed benefits — is the core mechanism targeted. It's why people prefer Netflix now over exercise now, even when they genuinely value fitness more."},

{name:"Commitment Devices",cat:"Friction & Effort",year:1978,author:"Thomas Schelling (formalized; concept is ancient)",catKey:"Friction",
overview:"A voluntary restriction made now to constrain future options, making it harder to defect from a goal when willpower is low. Examples: locking savings in an illiquid account, social accountability contracts, removing temptations from the home.",
history:"Schelling formalized commitment devices in his self-management game theory analysis (1978). StickK.com (Ayres, Dean & Karlan) operationalized financial commitment contracts. Ariely and behavioral economists brought it into mainstream research.",
methodType:"Game Theory Analysis + Field Experiments (Financial Contracts)",
methodology:"Schelling's (1978) paper was theoretical game theory analysis applying intertemporal conflict framing to self-control. Empirical testing came through field experiments: Ashraf, Karlan & Yin (2006) conducted an RCT in the Philippines with 1,777 bank clients randomly offered a 'SEED' savings account with self-imposed withdrawal restrictions (clients chose their own terms). Clients offered SEED accounts saved significantly more over 12 months than control clients. Ariely & Wertenbroch (2002) found that students offered the option to self-impose evenly spaced deadlines (vs. single final deadline) showed better task completion — even though the early deadlines were costly if missed. Bryan et al. (2010) meta-analyzed commitment devices across 21 studies, finding meaningful but heterogeneous effects across contexts.",
citation:"Schelling, T. C. (1978). Egonomics, or the Art of Self-Management. The American Economic Review, 68(2), 290–294.",
pros:["Addresses self-control failure before it occurs — not during temptation","Calibratable: from soft social accountability to hard financial penalties","Financial commitment contracts show meaningful increases in behavior change completion rates"],
cons:["Requires accurate self-prediction of future temptation — often inaccurate","Overly restrictive commitments can trigger reactance and behavioral rebellion","Financial stakes can produce anxiety that undermines wellbeing"],
notes:"Odysseus tying himself to the mast while passing the Sirens is the archetypal commitment device. Modern equivalents: leaving your phone in the car, giving friends money to hold, scheduling appointments in advance."},

{name:"SMART Goals",cat:"Goal-Setting",year:1981,author:"George T. Doran",catKey:"Goal",
overview:"Goals should be Specific, Measurable, Achievable (or Assignable), Relevant (or Realistic), and Time-bound. The framework ensures goals are operationalized clearly enough to guide action and evaluate progress.",
history:"Doran published a single-page management paper in Management Review (November 1981) proposing SMART as a mnemonic for writing management objectives. It became possibly the most widely used goal-setting framework globally.",
methodType:"Practitioner Mnemonic (No Empirical Study)",
methodology:"Doran's 1981 paper is a one-page opinion/practice piece in a management trade journal, not a research study. No sample, no control group, no outcome data — it is a proposed mnemonic for operationalizing management objectives, drawn from Doran's professional consulting experience. The paper has no formal methodology section. Empirical testing of SMART goals has been conducted by others since (e.g., Rubin, 2002) with mixed results. The actual empirical evidence base for goal-setting comes from Locke & Latham's program, not from Doran's paper. Notably, Locke & Latham's findings sometimes conflict with SMART's 'Achievable' criterion — they show difficult goals outperform achievable ones.",
citation:"Doran, G. T. (1981). There's a S.M.A.R.T. way to write management's goals and objectives. Management Review, 70(11), 35–36.",
pros:["Instantly teachable and widely understood","Forces operationalization of vague goals into concrete actions","Broadly applicable across personal, educational, and organizational contexts"],
cons:["No peer-reviewed empirical validation of the specific five criteria","'Achievable' and 'Realistic' may systematically suppress ambition","Can be applied mechanically, producing goals that are SMART but not meaningful"],
notes:"Locke & Latham's Goal-Setting Theory — the actual evidence base — shows difficult goals outperform easy/achievable ones. This directly contradicts SMART's 'Achievable/Realistic' criterion in high-performance contexts."},

{name:"Goal-Setting Theory",cat:"Goal-Setting",year:1990,author:"Edwin Locke & Gary Latham",catKey:"Goal",
overview:"Specific, difficult goals produce higher performance than vague or easy goals. Four mechanisms link goals to performance: focusing attention, mobilizing effort, increasing persistence, and developing task-relevant strategies.",
history:"Locke published early studies in the 1960s; Latham collaborated from the 1970s. Their 1990 book synthesized 400 studies and remains the most empirically supported theory in organizational psychology.",
methodType:"Laboratory and Field Experiments (400+ studies synthesized)",
methodology:"Locke & Latham's research program used both laboratory and field experiments. Lab methodology: participants (typically university students) assigned to one of several goal conditions — 'do your best,' easy specific goal, moderately difficult goal, or hard specific goal — then performed a quantitative task (e.g., brainstorming uses for common objects, arithmetic, driving simulation). Performance (quantity and quality) was measured immediately. Field studies: wood harvesting crews, truck drivers, typists, and engineers were given assigned hard vs. do-your-best goals; performance tracked over weeks or months via objective records. The 2002 meta-analytic review across 35 years of research confirmed the 'specificity and difficulty' principle held with effect sizes (d ≈ 0.5–0.8) across cultures, tasks, and settings. Moderators (feedback, commitment, task complexity) were also systematically investigated.",
citation:"Locke, E. A., & Latham, G. P. (1990). A Theory of Goal Setting and Task Performance. Prentice Hall. Locke, E. A., & Latham, G. P. (2002). Building a practically useful theory of goal setting. American Psychologist, 57(9), 705–717.",
pros:["Most replicated finding in organizational behavior — hundreds of supporting studies","Specific, difficult goals consistently outperform 'do your best' across cultures and tasks","Effect size is robust (d ≈ 0.5–0.8) and practically significant"],
cons:["Difficult goals can increase unethical behavior to meet them (tunnel vision + incentive pressure)","Performance degrades for complex novel tasks — goals create tunnel vision inhibiting exploration","Doesn't address what to do after goal attainment — can create post-achievement emptiness"],
notes:"The Wells Fargo account fraud scandal is a cautionary tale: specific, difficult sales goals reliably increase performance — and, under incentive pressure with weak oversight, also unethical shortcuts."},

{name:"Regulatory Focus Theory",cat:"Goal-Setting",year:1997,author:"E. Tory Higgins",catKey:"Goal",
overview:"People pursue goals through two motivational orientations: Promotion focus (seeking gains, aspirations — eager approach) or Prevention focus (avoiding losses, obligations — vigilant avoidance). Each responds differently to messages and incentives.",
history:"Higgins proposed the theory in a 1997 Psychological Review paper, extending Freud's approach-avoidance distinction through cognitive social psychology. Foundational to persuasion research, consumer psychology, and leadership.",
methodType:"Laboratory Experiments (Anagram Tasks, Persuasion Paradigms)",
methodology:"Higgins and colleagues conducted multiple experiments to establish regulatory focus effects. Key study (Shah, Higgins & Friedman, 1998): participants completed either a promotion-focus or prevention-focus priming task (writing about hopes/aspirations vs. duties/obligations), then worked on anagram tasks. Promotion-focused participants showed faster response times for 'gain' outcomes (hits); prevention-focused for 'non-loss' outcomes (correct rejections). Persuasion experiments (Cesario et al., 2004) manipulated message framing (gain-framed vs. loss-framed messages about exercise) and recipient regulatory focus, finding regulatory fit — match between message framing and recipient focus — increased persuasion, attitude strength, and behavioral intention. The Regulatory Focus Questionnaire (RFQ) was developed to measure chronic individual differences in promotion vs. prevention orientation.",
citation:"Higgins, E. T. (1997). Beyond pleasure and pain. American Psychologist, 52(12), 1280–1300.",
pros:["Explains why identical messages work for some people but not others","Regulatory fit effect: matching framing to focus significantly increases persuasion","Robust meta-analytic support across persuasion, consumer behavior, and performance"],
cons:["Individual chronic focus is difficult to measure reliably across contexts","Situationally-induced focus may override chronic focus unpredictably","Two-category model may oversimplify a spectrum of motivational orientations"],
notes:"Regulatory fit: gain-framing works better for promotion-focused people, loss-framing for prevention-focused. Mismatched framing is not just less effective — it actively reduces engagement and satisfaction."},

{name:"WOOP / Mental Contrasting",cat:"Goal-Setting",year:2000,author:"Gabriele Oettingen",catKey:"Goal",
overview:"WOOP: Wish (name the goal) → Outcome (vividly imagine the best result) → Obstacle (identify the inner barrier) → Plan (if [obstacle], then I will [behavior]). Mental Contrasting — imagining positive future then obstacle reality — creates energized, realistic commitment vs. passive fantasizing.",
history:"Oettingen's research (2000–2015) showed pure positive visualization reduces motivation by simulating achievement. Mental Contrasting activates commitment only when success expectancy is moderate-to-high. WOOP formalizes this into a teachable four-step tool.",
methodType:"Randomized Controlled Experiments (Multiple Domains)",
methodology:"Oettingen & colleagues conducted a program of RCTs across multiple domains. Core methodology: participants randomly assigned to one of three conditions — (a) Mental Contrasting (imagine positive future outcome, then imagine the inner obstacle), (b) Indulging (imagine positive future only), or (c) Dwelling (think about the obstacle only). Physiological measures: systolic blood pressure and energy (measured via hand dynamometer grip strength) were taken before and after. Mental contrasting produced significantly higher energy mobilization than indulging, but only when participants reported high expectation of success — confirming the moderating role of expectancy. Oettingen & Gollwitzer later combined MCII (Mental Contrasting with Implementation Intentions) in RCTs showing WOOP outperformed either technique alone across academic, dietary, and physical activity outcomes (e.g., Duckworth et al., 2011, with middle-school students improving study habits).",
citation:"Oettingen, G. (2000). Expectancy effects on behavior depend on self-regulatory thought. Social Cognition, 18(2), 101–129. Oettingen, G. (2014). Rethinking Positive Thinking. Current/Penguin.",
pros:["Empirically supported across academic, health, and interpersonal domains","Directly challenges positive visualization orthodoxy with experimental evidence","Combines two evidence-based techniques (MC + implementation intentions) for amplified effect"],
cons:["Mental Contrasting works best with moderate-to-high success expectancy — may demotivate with very low expectancy","WOOP mnemonic is simple but the underlying psychological process is more complex","Requires reflection capacity and emotional tolerance for confronting real obstacles"],
notes:"Oettingen's most counterintuitive finding: pure positive fantasizing lowers systolic blood pressure and reduces energy mobilization — the body behaves as if the goal is already achieved, reducing the drive to pursue it."}
];

const categories=["All","Habit Formation","Motivation & Drive","Decision-Making & Cognition","Behavior Change (Clinical/Applied)","Reinforcement & Conditioning","Identity & Values","Social & Environmental","Friction & Effort","Goal-Setting"];
let activeFilter="All";
let searchTerm="";

function getCatClass(c){
  const map={"Habit":"cat-Habit","Motivation":"cat-Motivation","Decision":"cat-Decision","Behavior":"cat-Behavior","Reinforcement":"cat-Reinforcement","Identity":"cat-Identity","Social":"cat-Social","Friction":"cat-Friction","Goal":"cat-Goal"};
  return map[c]||"cat-Habit";
}

function buildPills(){
  const el=document.getElementById("filter-pills");
  categories.forEach(c=>{
    const p=document.createElement("button");
    p.className="pill"+(c==="All"?" all active":"");
    p.textContent=c;
    p.dataset.cat=c;
    p.onclick=()=>{
      activeFilter=c;
      document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      filterCards();
    };
    el.appendChild(p);
  });
}

function filterCards(){
  const cards=document.querySelectorAll(".card");
  let vis=0;
  cards.forEach(card=>{
    const cat=card.dataset.cat;
    const name=card.dataset.name;
    const author=card.dataset.author;
    const text=card.dataset.text||"";
    const matchCat=activeFilter==="All"||cat===activeFilter;
    const matchSearch=!searchTerm||name.includes(searchTerm)||author.includes(searchTerm)||text.includes(searchTerm);
    if(matchCat&&matchSearch){card.classList.remove("hidden");vis++;}
    else{card.classList.add("hidden");}
  });
  document.getElementById("count").textContent=vis+" model"+(vis===1?"":"s");
  document.getElementById("empty").className="empty"+(vis===0?" show":"");
}

function buildCards(){
  const grid=document.getElementById("grid");
  models.forEach((m)=>{
    const card=document.createElement("div");
    card.className="card";
    card.dataset.cat=m.cat;
    card.dataset.name=m.name.toLowerCase();
    card.dataset.author=m.author.toLowerCase();
    card.dataset.text=(m.overview+" "+m.history+" "+m.methodology+" "+(m.notes||"")).toLowerCase();
    const prosHTML=m.pros.map(p=>`<li>${p}</li>`).join("");
    const consHTML=m.cons.map(c=>`<li>${c}</li>`).join("");
    card.innerHTML=`
<div class="card-head" onclick="toggleCard(this)">
  <div class="card-meta">
    <span class="cat-badge ${getCatClass(m.catKey)}">${m.cat}</span>
    <span class="year-badge">${m.year}</span>
  </div>
  <div class="card-title">${m.name}</div>
  <div class="card-author">${m.author}</div>
  <div class="overview">${m.overview}</div>
  <span class="toggle">
    <span>Full details</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
  </span>
</div>
<div class="card-details">
  <div class="detail-section">
    <div class="detail-label">History</div>
    <div class="detail-text">${m.history}</div>
  </div>
  <div class="detail-section">
    <div class="detail-label">Methodology</div>
    <div class="method-box">
      <div class="method-type">${m.methodType}</div>
      <p>${m.methodology}</p>
    </div>
  </div>
  <div class="detail-section">
    <div class="detail-label">Citation</div>
    <div class="citation">${m.citation}</div>
  </div>
  <div class="detail-section">
    <div class="detail-label">Evaluation</div>
    <div class="pros-cons">
      <div class="pros"><div class="sub-label">Pros</div><ul>${prosHTML}</ul></div>
      <div class="cons"><div class="sub-label">Cons</div><ul>${consHTML}</ul></div>
    </div>
  </div>
  ${m.notes?`<div class="detail-section"><div class="detail-label">Key insight</div><div class="note-box">${m.notes}</div></div>`:""}
</div>`;
    grid.appendChild(card);
  });
}

function toggleCard(head){
  const details=head.nextElementSibling;
  const toggle=head.querySelector(".toggle");
  const open=details.classList.toggle("open");
  toggle.classList.toggle("open",open);
  toggle.querySelector("span").textContent=open?"Hide details":"Full details";
}

document.getElementById("search").addEventListener("input",function(){
  searchTerm=this.value.trim().toLowerCase();
  filterCards();
});

buildPills();
buildCards();
</script>
</body>
</html>
